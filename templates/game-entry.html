<!-- Copy into both index pages. Replace {{...}}, translate the copy and labels,
     and adjust availability in each row. See AGENTS.md for the field meanings.
     Paths below are relative to public/index.html; prefix ../ on /no/. -->
<article id="{{slug}}" aria-labelledby="{{slug}}-title">
  <img class="game-still" src="art/{{screenshot}}.webp" width="1224" height="688" loading="lazy" alt="{{what is happening in the game}}">
  <div class="game-copy">
    <p class="status pre-alpha">Pre-alpha</p>
    <h2 id="{{slug}}-title">{{title}}</h2>
    <p>{{One or two sentences about what the player actually does.}}</p>
    <div class="links">
      <div class="play-group">
        <a class="play" href="{{play_url}}">Play in browser <span aria-hidden="true">→</span></a>
      </div>
      <a href="{{game_homepage}}">Game website</a>
    </div>
    <details class="game-details">
      <summary>Game details</summary>
      <dl class="specs">
        <dt>Platforms</dt>
        <dd>
          <a href="{{play_url}}"><svg aria-hidden="true"><use href="art/catalog.svg#browser"/></svg>Browser</a>
          <span class="unavailable"><span class="sr-only">No download available:</span>
            <span class="tag" title="Android — unavailable"><svg role="img" aria-label="Android"><use href="art/catalog.svg#android"/></svg></span>
            <span class="tag" title="iOS — unavailable"><svg aria-hidden="true"><use href="art/catalog.svg#apple"/></svg>iOS</span>
            <span class="tag" title="Windows — unavailable"><svg role="img" aria-label="Windows"><use href="art/catalog.svg#windows"/></svg></span>
            <span class="tag" title="macOS — unavailable"><svg aria-hidden="true"><use href="art/catalog.svg#apple"/></svg>macOS</span>
            <span class="tag" title="Linux — unavailable"><svg role="img" aria-label="Linux"><use href="art/catalog.svg#linux"/></svg></span>
          </span>
        </dd>
        <dt>Controls</dt>
        <dd>
          <span class="tag"><svg aria-hidden="true"><use href="art/catalog.svg#keyboard"/></svg>Keyboard</span>
          <span class="tag"><svg aria-hidden="true"><use href="art/catalog.svg#touch"/></svg>Touch</span>
          <span class="tag"><svg aria-hidden="true"><use href="art/catalog.svg#gamepad"/></svg>Gamepad</span>
        </dd>
        <dt>Est. demand</dt>
        <dd><span class="demand medium" aria-hidden="true"><i></i><i></i><i></i></span>Moderate</dd>
      </dl>
    </details>
  </div>
</article>
